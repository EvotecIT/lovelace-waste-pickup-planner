<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Waste Pickup Planner · preview</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        --primary-text-color: #e7e9ed;
        --secondary-text-color: #a2a7b0;
        --card-background-color: #202329;
        --divider-color: #ffffff16;
        --primary-color: #75baba;
        --ha-card-border-radius: 20px;
        background: #15171b;
        color: var(--primary-text-color);
      }
      body {
        color: var(--primary-text-color);
        margin: 0;
        padding: 32px;
        max-width: 1400px;
        margin-inline: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.03em;
        margin: 0;
      }
      header p {
        font-size: 13px;
        color: var(--secondary-text-color);
      }
      button,
      select {
        font: inherit;
        padding: 10px;
        border-radius: 10px;
        color: inherit;
        border: 1px solid var(--divider-color);
        background: var(--card-background-color);
        min-height: 44px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
        gap: 24px;
        align-items: start;
      }
      .panel {
        min-width: 0;
      }
      .label {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--secondary-text-color);
        margin: 0 0 12px;
      }
      #badge {
        margin-bottom: 24px;
      }
      body.light {
        --primary-text-color: #252931;
        --secondary-text-color: #676e78;
        --card-background-color: #fff;
        --divider-color: #00000018;
        --primary-color: #267b78;
      }
      html:has(body.light) {
        background: #f1f3f5;
      }
      body.theme {
        --primary-text-color: #eee9df;
        --secondary-text-color: #c2b6a4;
        --card-background-color: #34302a;
        --divider-color: #ffffff20;
        --primary-color: #d8b26b;
        --ha-card-border-radius: 6px;
      }
      ha-icon {
        display: inline-flex;
        width: var(--mdc-icon-size, 24px);
        height: var(--mdc-icon-size, 24px);
      }
      ha-icon svg {
        width: 100%;
        height: 100%;
      }
      @media (max-width: 400px) {
        body {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Waste Pickup Planner</h1>
        <p>Component preview · synthetic household schedule</p>
      </div>
      <div>
        <button id="theme">Theme</button>
        <select id="state" aria-label="Schedule state">
          <option value="ready">Available</option>
          <option value="empty">Empty</option>
          <option value="unavailable">Unavailable</option>
          <option value="stale">Stale</option>
          <option value="long">Long labels</option>
          <option value="pl">Polski</option>
        </select>
      </div>
    </header>
    <div id="badge"></div>
    <main>
      <section class="panel">
        <p class="label">HERO</p>
        <div id="hero"></div>
      </section>
      <section class="panel">
        <p class="label">COMPACT</p>
        <div id="compact"></div>
      </section>
      <section class="panel">
        <p class="label">SCHEDULE</p>
        <div id="schedule"></div>
      </section>
    </main>
    <script type="module" src="/demo/demo.js"></script>
  </body>
</html>
